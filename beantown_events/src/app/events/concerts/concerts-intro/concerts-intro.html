<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Intro | Concerts</title>
        <link rel="stylesheet" type="text/css" href="concerts-intro.css">
        <!--  PAGE ICON - from W3Schools. https://www.w3schools.com/html/html_favicon.asp
          Sets the small logo icon in the browser tab next to the page title -->
        <link rel="icon" type="image/x-icon" href="../src/logo-dark.jpg">
    </head>
    <!-- All content in this page has been done by Jackson -->
    <body>
        <main id="main-concerts-intro">
            <!-- CONCERT CROWD BACKGROUND (bottom layer) -->
            <div id="background-concerts-intro"></div>
            <div id="background-next-concerts-intro"></div>

            <!-- CINCHED CURTAINS (Back layer - visible on sides) -->
            <div id="cinched-left-concerts-intro"></div>
            <div id="cinched-right-concerts-intro"></div>

            <!-- FRONT CURTAINS (slide apart on scroll) -->
            <div id="curtain-wrapper-concerts-intro">

                <div class="curtain-concerts-intro" id="curtain-left-concerts-intro"></div>

                <div class="curtain-concerts-intro" id="curtain-right-concerts-intro"></div>

                <div id="spotlight-concerts-intro"></div>

                <!-- CLICK PROMPT (visible before scroll) -->
                <div id="scroll-prompt-concerts-intro">
                    <span class="big-text-concerts-intro">Beantown Events</span>
                    <p>Scroll to enter</p>
                </div>

            </div>

            <div id="spotlight-after-concerts-intro"></div>
            <div id="stage-content-concerts-intro">
                <h1>Beantown Events</h1>
                <p class="subtitle-concerts-intro">Find Boston Events Near You</p>
                <a href="../concerts/concerts.html" id="enter-btn-concerts-intro">View All Concerts</a>
            </div>

            <!-- VALANCE (the drape on the top) -->
            <div id="valance-concerts-intro"></div>

        </main>

        <!-- Footer (Copyright statement, Link to Credits) -->
        <footer>
            <p>
                &#169; 2026 Beantown Events. <a href="../credits/credits.html">All Rights Reserved</a>
            </p>
        </footer>

        <script src="concerts-intro.js"></script>
